<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
  </defs>

  <!-- background circle -->
  <circle cx="100" cy="100" r="96" fill="#0F172A"/>

  <!-- cloud shape -->
  <path d="
    M55 120
    a28 28 0 0 1 8 -54.8
    a36 36 0 0 1 69 -8
    a26 26 0 0 1 -6 62.8
    z"
    fill="url(#cloudGrad)"/>

  <!-- vault door circle -->
  <circle cx="100" cy="102" r="21" fill="#0F172A" stroke="#E2E8F0" stroke-width="4"/>
  <circle cx="100" cy="102" r="7" fill="#E2E8F0"/>

  <!-- vault handle spokes -->
  <line x1="100" y1="102" x2="100" y2="88" stroke="#E2E8F0" stroke-width="3" stroke-linecap="round"/>
  <line x1="100" y1="102" x2="111" y2="109" stroke="#E2E8F0" stroke-width="3" stroke-linecap="round"/>
  <line x1="100" y1="102" x2="89" y2="109" stroke="#E2E8F0" stroke-width="3" stroke-linecap="round"/>
</svg>
